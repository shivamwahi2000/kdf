# Example: Hybrid Architecture - Batch + Streaming
#
# This demonstrates a hybrid approach where:
# - Batch pipelines process historical/daily data
# - Streaming pipelines handle real-time clickstream
#
# Batch Path:  Postgres → Bronze → Silver → Gold (hourly/daily)
# Stream Path: Kafka → Bronze → Silver (real-time, 5-min micro-batch)

name: hybrid_clickstream
description: Hybrid batch + streaming architecture

pipelines:
  # === BATCH PATH: Historical Orders ===

  - name: bronze_orders_batch
    medallion:
      layer: bronze
      quality_level: raw

    execution_mode: batch

    source:
      type: postgres
      connection: production_postgres
      table: orders

    ingestion:
      skill: incremental
      column: updated_at

    target:
      type: delta
      path: /medallion/bronze/orders
      mode: append


  # === STREAMING PATH: Real-time Clickstream ===

  - name: bronze_clickstream_streaming
    medallion:
      layer: bronze
      quality_level: raw

    execution_mode: streaming
    trigger: "5 minutes"
    checkpoint_location: /checkpoints/bronze_clickstream

    source:
      type: kafka
      bootstrap_servers: kafka:9092
      topic: clickstream
      starting_offsets: latest
      group_id: kdf_clickstream

    target:
      type: delta
      path: /medallion/bronze/clickstream
      mode: append


  # === SILVER LAYER: Combined ===

  - name: silver_orders
    depends_on: [bronze_orders_batch]

    medallion:
      layer: silver
      upstream_layers: [bronze]

    execution_mode: batch

    source:
      type: delta
      path: /medallion/bronze/orders

    skills:
      - deduplicate:
          keys: [order_id]

    quality:
      - not_null:
          columns: [order_id, customer_id]
      - unique:
          columns: [order_id]

    target:
      type: delta
      path: /medallion/silver/orders
      mode: overwrite

  - name: silver_clickstream
    depends_on: [bronze_clickstream_streaming]

    medallion:
      layer: silver
      upstream_layers: [bronze]

    execution_mode: micro_batch
    trigger: "5 minutes"
    checkpoint_location: /checkpoints/silver_clickstream

    source:
      type: delta
      path: /medallion/bronze/clickstream
      streaming: true

    skills:
      - deduplicate:
          keys: [session_id, timestamp]

    quality:
      - not_null:
          columns: [user_id, event_type, timestamp]

    target:
      type: delta
      path: /medallion/silver/clickstream
      mode: append


  # === GOLD LAYER: Analytics ===

  - name: gold_user_activity
    depends_on: [silver_orders, silver_clickstream]

    medallion:
      layer: gold
      upstream_layers: [silver]

    execution_mode: batch

    source:
      type: delta
      path: /medallion/silver/clickstream

    skills:
      - aggregate:
          group_by: [user_id, event_date]
          metrics:
            - name: event_count
              agg: count
            - name: unique_sessions
              agg: count_distinct
              column: session_id
            - name: avg_session_duration
              agg: avg
              column: session_duration

    target:
      type: delta
      path: /medallion/gold/user_activity
      mode: overwrite
      partition_by: [event_date]
