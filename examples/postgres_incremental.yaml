# Example: PostgreSQL Incremental Ingestion
#
# This pipeline demonstrates:
# - Incremental load from PostgreSQL using watermark
# - Deduplication by order_id
# - Data quality checks (not_null, unique, freshness)
# - Writing to Delta Lake with partitioning

name: orders_ingestion

source:
  type: postgres
  connection: production_postgres
  database: sales
  schema: public
  table: orders

  # Optional: Enable partitioned JDBC reads for better performance
  # partition_column: customer_id
  # num_partitions: 8
  # lower_bound: 1
  # upper_bound: 1000000

ingestion:
  skill: incremental
  column: updated_at

skills:
  # Remove duplicates, keeping the most recent record
  - deduplicate:
      keys: [order_id]
      order_by: updated_at

  # Detect schema changes and handle appropriately
  - schema_evolution:
      mode: compatible  # Options: compatible, warning, strict

quality:
  # Ensure critical fields are not null
  - not_null:
      columns:
        - order_id
        - customer_id
        - order_date
        - updated_at

  # Verify order_id uniqueness
  - unique:
      columns:
        - order_id

  # Check data freshness
  - freshness:
      column: updated_at
      threshold: 6h

target:
  type: delta
  path: /data/orders
  mode: append
  partition_by: [order_date]
